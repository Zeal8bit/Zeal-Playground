<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zeal 8-bit Playground</title>
    <link rel="icon" href="imgs/zeal.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CodeMirror (from CSDN CDN) -->

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css"
      integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/fold/foldgutter.min.css"
      integrity="sha512-YwkMTlTHn8dBnwa47IF+cKsS00HPiiVhQ4DpwT1KF2gUftfFR7aefepabSPLAs6zrMyD89M3w0Ow6mQ5XJEUCw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"
      integrity="sha512-hJEMjfR4ds7mXbBot3i/R+CsiyYpeWSezXul8uLBT8wXAHPUdhRgl4LLTtMGwjarftGKiQqK1v20XScm0ANTPQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/mode/overlay.min.js"
      integrity="sha512-SNwKDMYQwymOPjleeZy1xbdlK1PAjJ6EAplvx0CvNFJbW/pF5ec3h0mAdDl1yySq9r3Qont4STM4W3le7FTm9w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/selection/active-line.min.js"
      integrity="sha512-0sDhEPgX5DsfNcL5ty4kP6tR8H2vPkn40GwA0RYTshkbksURAlsRVnG4ECPPBQh7ZYU6S3rGvp5uhlGQUNrcmA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/fold/foldgutter.min.js"
      integrity="sha512-TRBGROluEM9UrFPnoCk0vW2PqqcMUyGJETe60qzktKTEiXmPhmxqJLYqOf7TsX4ulMbANjdpLY+DYk0aoht4gA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/fold/foldcode.min.js"
      integrity="sha512-Q2qfEJEU257Qlqc4/5g6iKuJNnn5L0xu2D48p8WHe9YC/kLj2UfkdGD01qfxWk+XIcHsZngcA8WuKcizF8MAHA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/comment/comment.min.js"
      integrity="sha512-UaJ8Lcadz5cc5mkWmdU8cJr0wMn7d8AZX5A24IqVGUd1MZzPJTq9dLLW6I102iljTcdB39YvVcCgBhM0raGAZQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="js/z80-playground.js"></script>

    <!-- Playground -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/playground.css" />
    <link rel="stylesheet" href="css/explorer.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/emulator.css" />
  </head>
  <body class="loading">
    <header id="topbar">
      <img class="logo" src="imgs/zeal.png" alt="" />
      <h1>Zeal 8-bit Playground</h1>
      <div class="actions">
        <button onclick="download_binary()"><i class="fa-solid fa-download"></i> Download</button>
        <button onclick="assemble()"><i class="fa-solid fa-code"></i> Assemble</button>
        <button class="run" onclick="code_run()"><i class="fa-solid fa-play"></i> Run</button>
      </div>
      <button aria-label="Preferences" title="Preferences" popovertarget="preferences"><i class="fa-solid fa-sliders"></i> <span>Preferences</span></button>
      <div id="preferences" popover>
        <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
        <label><input type="checkbox" name="enable_zealos" /> Enable Zeal OS</label>
        <label><input type="checkbox" name="verbose" /> Verbose</label>
        <button onclick="prefs_reset_layout()">Reset Layout</button>
      </div>
    </header>

    <main id="viewport">
      <details id="explorer" open>
        <summary title="Toggle file explorer"><i class="fa-solid fa-folder-tree"></i> <span>Explorer</span></summary>
        <div class="contents">
          <button class="new-file"><i class="fa-solid fa-plus"></i> New File</button>
          <div class="files scrollbars"></div>
        </div>
      </details>

      <div id="workspace">
        <section id="editor" class="expand" aria-label="Code editor">
          <div class="file-tab">
            <span class="filename">main.asm</span>
            <button class="fa-solid fa-copy" title="Copy source" aria-label="Copy source"></button>
            <button class="fa-solid fa-save" title="Save file" aria-label="Save file"></button>
          </div>
          <textarea name="content"></textarea>
        </section>
        <div class="resize-column" role="separator" aria-label="Editor width" aria-orientation="vertical" tabindex="0"></div>
        <section id="emulator" aria-label="Emulator">
          <div class="preview-heading">
            <h2>Emulator</h2>
            <div class="controls hidden">
              <button class="toggle-fps">Toggle FPS</button>
              <button class="code-stop" onclick="code_stop()"><i class="fa-solid fa-stop"></i> Stop</button>
            </div>
          </div>
          <div id="canvas-container"><canvas id="canvas" tabindex="0" width="640" height="480"></canvas></div>
          <div class="output scrollbars hidden"></div>
        </section>
      </div>

      <details id="build-output">
        <summary>Build output <span class="log" id="log" role="status">Ready to assemble</span></summary>
        <div class="output-panes">
          <section id="assembler" class="scrollbars">
            <h2>Hex</h2>
            <pre id="hex-view">Hex view will appear here.</pre>
          </section>
          <section id="listing" class="scrollbars">
            <div class="controls"><h2>Listing</h2><button class="fa-solid fa-copy" title="Copy listing" aria-label="Copy listing"></button></div>
            <pre id="list-view">Listing will appear here.</pre>
          </section>
        </div>
      </details>
    </main>

    <script src="js/playground.js"></script>
    <script src="js/explorer.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/emulator.js"></script>
    <script src="js/assembler.js"></script>
    <script src="js/listing.js"></script>

    <script src="wasm/native/zeal.elf.js"></script>
    <script src="wasm/native/libnative/disk-images.js"></script>
    <script src="wasm/native/libnative/zeal-native.js"></script>
    <script src="wasm/gnu-as/as.js"></script>
    <script src="wasm/gnu-as/ld.js"></script>
    <script src="wasm/gnu-as/objcopy.js"></script>
    <script src="wasm/gnu-as/toolchain.js"></script>
  </body>
</html>
